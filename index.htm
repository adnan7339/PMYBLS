<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMYBLS Advanced Search</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg-primary:#0a0e1a;
    --bg-secondary:#141b2d;
    --bg-card:#1a2332;
    --accent-primary:#00d9ff;
    --accent-secondary:#7c3aed;
    --text-primary:#ffffff;
    --text-secondary:#94a3b8;
    --success:#10b981;
    --error:#ef4444;
    --border:#2d3748;
}

body{
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:'Outfit', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
}

/* Animated Background */
body::before{
    content:'';
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 30%, rgba(0,217,255,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(124,58,237,0.08) 0%, transparent 50%);
    z-index:0;
    animation:bgFloat 20s ease-in-out infinite;
}

@keyframes bgFloat{
    0%, 100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

.container{
    max-width:1200px;
    margin:0 auto;
    padding:40px 20px;
    position:relative;
    z-index:1;
}

/* Header Section */
.header{
    text-align:center;
    margin-bottom:50px;
    animation:fadeInDown 0.8s ease-out;
}

@keyframes fadeInDown{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.header h1{
    font-size:3rem;
    font-weight:700;
    background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:10px;
    letter-spacing:-1px;
}

.header p{
    color:var(--text-secondary);
    font-size:1.1rem;
    font-weight:300;
}

/* Data Status Card */
.data-status{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    animation:fadeInUp 0.8s ease-out 0.2s both;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.data-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.data-icon{
    width:50px;
    height:50px;
    background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
    0%, 100%{transform:scale(1);}
    50%{transform:scale(1.05);}
}

.data-details h3{
    font-size:1.1rem;
    font-weight:600;
    margin-bottom:5px;
}

.data-details p{
    color:var(--text-secondary);
    font-size:0.9rem;
    font-family:'Space Mono', monospace;
}

.data-badge{
    padding:8px 16px;
    background:rgba(16,185,129,0.15);
    color:var(--success);
    border-radius:20px;
    font-size:0.85rem;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
}

.data-badge.loading{
    background:rgba(0,217,255,0.15);
    color:var(--accent-primary);
}

.spinner{
    width:16px;
    height:16px;
    border:2px solid transparent;
    border-top-color:currentColor;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* Search Card */
.search-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:40px;
    margin-bottom:40px;
    animation:fadeInUp 0.8s ease-out 0.4s both;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.search-form{
    display:flex;
    gap:15px;
    align-items:stretch;
}

.input-wrapper{
    flex:1;
    position:relative;
}

.input-wrapper input{
    width:100%;
    padding:18px 24px;
    font-size:1.1rem;
    font-family:'Space Mono', monospace;
    background:var(--bg-secondary);
    border:2px solid var(--border);
    border-radius:14px;
    color:var(--text-primary);
    transition:all 0.3s ease;
}

.input-wrapper input:focus{
    outline:none;
    border-color:var(--accent-primary);
    box-shadow:0 0 0 4px rgba(0,217,255,0.1);
}

.input-wrapper input::placeholder{
    color:var(--text-secondary);
}

.search-btn{
    padding:18px 40px;
    font-size:1.1rem;
    font-weight:600;
    background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    border:none;
    border-radius:14px;
    color:var(--text-primary);
    cursor:pointer;
    transition:all 0.3s ease;
    position:relative;
    overflow:hidden;
}

.search-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,217,255,0.3);
}

.search-btn:active{
    transform:translateY(0);
}

.search-btn.searching{
    pointer-events:none;
    opacity:0.7;
}

.search-btn.searching::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation:shimmer 1.5s infinite;
}

@keyframes shimmer{
    to{left:100%;}
}

/* Results Section */
.results-section{
    animation:fadeInUp 0.8s ease-out 0.6s both;
}

.results-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.results-header h2{
    font-size:1.8rem;
    font-weight:600;
}

.results-count{
    padding:8px 16px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:20px;
    font-size:0.9rem;
    color:var(--text-secondary);
}

/* Table Container */
.table-container{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:var(--bg-secondary);
    border-bottom:2px solid var(--border);
}

th{
    padding:20px;
    text-align:left;
    font-weight:600;
    font-size:0.95rem;
    color:var(--accent-primary);
    text-transform:uppercase;
    letter-spacing:0.5px;
}

tbody tr{
    border-bottom:1px solid var(--border);
    transition:all 0.3s ease;
    animation:fadeInRow 0.5s ease-out both;
}

@keyframes fadeInRow{
    from{
        opacity:0;
        transform:translateX(-20px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

tbody tr:nth-child(1){animation-delay:0.1s;}
tbody tr:nth-child(2){animation-delay:0.2s;}
tbody tr:nth-child(3){animation-delay:0.3s;}
tbody tr:nth-child(4){animation-delay:0.4s;}
tbody tr:nth-child(5){animation-delay:0.5s;}

tbody tr:hover{
    background:rgba(0,217,255,0.05);
    transform:scale(1.01);
}

tbody tr:last-child{
    border-bottom:none;
}

td{
    padding:20px;
    color:var(--text-primary);
    font-size:1rem;
}

td:first-child{
    font-family:'Space Mono', monospace;
    color:var(--accent-primary);
    font-weight:600;
}

/* Empty State */
.empty-state{
    padding:80px 40px;
    text-align:center;
}

.empty-icon{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    background:var(--bg-secondary);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    opacity:0.5;
}

.empty-state h3{
    font-size:1.5rem;
    margin-bottom:10px;
    color:var(--text-secondary);
}

.empty-state p{
    color:var(--text-secondary);
    opacity:0.7;
}

/* Loading State */
.loading-state{
    padding:80px 40px;
    text-align:center;
}

.loading-spinner{
    width:60px;
    height:60px;
    margin:0 auto 20px;
    border:4px solid var(--border);
    border-top-color:var(--accent-primary);
    border-radius:50%;
    animation:spin 1s linear infinite;
}

.loading-state h3{
    font-size:1.3rem;
    margin-bottom:8px;
}

.loading-state p{
    color:var(--text-secondary);
}

/* Error State */
.error-state{
    padding:80px 40px;
    text-align:center;
}

.error-icon{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    background:rgba(239,68,68,0.15);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    color:var(--error);
}

.error-state h3{
    font-size:1.5rem;
    margin-bottom:10px;
    color:var(--error);
}

.error-state p{
    color:var(--text-secondary);
}

/* Responsive Design */
@media(max-width:768px){
    .header h1{
        font-size:2rem;
    }
    
    .data-status{
        flex-direction:column;
        gap:15px;
        text-align:center;
    }
    
    .search-form{
        flex-direction:column;
    }
    
    .search-card{
        padding:25px;
    }
    
    .results-header{
        flex-direction:column;
        gap:15px;
        align-items:flex-start;
    }
    
    table{
        font-size:0.9rem;
    }
    
    th, td{
        padding:12px;
    }
}

/* Accessibility */
@media(prefers-reduced-motion:reduce){
    *{
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>

<body>
<div class="container">

<!-- Header -->
<div class="header">
    <h1>🔍 PMYBLS Search</h1>
    <p>Advanced Applicant Search System</p>
</div>

<!-- Data Status Card -->
<div class="data-status" id="dataStatus">
    <div class="data-info">
        <div class="data-icon">📊</div>
        <div class="data-details">
            <h3>Data Connection</h3>
            <p id="sheetInfo">Loading from Google Sheets...</p>
        </div>
    </div>
    <div class="data-badge loading" id="statusBadge">
        <span class="spinner"></span>
        <span>Loading...</span>
    </div>
</div>

<!-- Search Card -->
<div class="search-card">
    <div class="search-form">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="cnic" 
                placeholder="XXXXX-XXXXXXX-X" 
                maxlength="15"
                autocomplete="off"
            >
        </div>
        <button class="search-btn" id="searchBtn" onclick="searchData()">
            <span id="btnText">🔎 Search</span>
        </button>
    </div>
</div>

<!-- Results Section -->
<div class="results-section">
    <div class="results-header">
        <h2>Search Results</h2>
        <div class="results-count" id="resultsCount">
            Ready to search
        </div>
    </div>
    
    <div class="table-container">
        <table>
            <tbody id="resultTable">
                <tr>
                    <td colspan="4" class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3>Ready to Search</h3>
                        <p>Enter CNIC number above and press Enter or click Search</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</div>

<script>
// ================== GOOGLE SHEET CONFIG ==================
const SHEET_ID   = "1n2_6Oewp88igcRv5H7vKYpYH-jHmnTus";
const SHEET_NAME = "Sheet1";

// ================== GLOBAL DATA ==================
let excelData = [];
let dataLoaded = false;

// ================== LOAD DATA ON PAGE LOAD ==================
window.onload = async function(){
    await loadData();
    document.getElementById("cnic").focus();
};

// ================== LOAD DATA FROM GOOGLE SHEETS ==================
async function loadData(){
    const statusBadge = document.getElementById("statusBadge");
    const sheetInfo = document.getElementById("sheetInfo");
    
    try{
        statusBadge.className = "data-badge loading";
        statusBadge.innerHTML = '<span class="spinner"></span><span>Connecting...</span>';
        sheetInfo.textContent = "Connecting to Google Sheets...";
        
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
        const startTime = Date.now();
        const res = await fetch(url);
        const text = await res.text();
        const loadTime = Date.now() - startTime;
        
        excelData = parseCSV(text);
        dataLoaded = true;
        
        // Update UI with success
        const recordCount = excelData.length - 1; // Exclude header
        statusBadge.className = "data-badge";
        statusBadge.innerHTML = '<span>✓</span><span>Connected</span>';
        sheetInfo.innerHTML = `Sheet: <strong>${SHEET_NAME}</strong> • Records: <strong>${recordCount.toLocaleString()}</strong> • Load Time: <strong>${loadTime}ms</strong>`;
        
    }catch(error){
        console.error("Data load error:", error);
        statusBadge.className = "data-badge";
        statusBadge.style.background = "rgba(239,68,68,0.15)";
        statusBadge.style.color = "var(--error)";
        statusBadge.innerHTML = '<span>⚠</span><span>Error</span>';
        sheetInfo.textContent = "Failed to load data. Please refresh the page.";
    }
}

// ================== CSV PARSER ==================
function parseCSV(csv){
    const lines = csv.split("\n");
    return lines.map(line =>
        line.split(",").map(cell => cell.replace(/^"|"$/g,"").trim())
    );
}

// ================== NORMALIZE CNIC ==================
function normalize(val){
    return String(val || "").replace(/\D/g,"");
}

// ================== SEARCH FUNCTION ==================
function searchData(){
    if(!dataLoaded){
        showError("Data not loaded yet. Please wait...");
        return;
    }
    
    const input = normalize(document.getElementById("cnic").value);
    const searchBtn = document.getElementById("searchBtn");
    const btnText = document.getElementById("btnText");
    const resultsCount = document.getElementById("resultsCount");
    
    if(input.length !== 13){
        showError("Please enter valid 13 digit CNIC");
        return;
    }
    
    // Show loading state
    searchBtn.classList.add("searching");
    btnText.textContent = "⏳ Searching...";
    showLoading();
    
    // Simulate processing time for better UX
    setTimeout(()=>{
        const rows = excelData.slice(1); // skip header
        const results = rows.filter(r => normalize(r[0]) === input);
        
        searchBtn.classList.remove("searching");
        btnText.textContent = "🔎 Search";
        
        if(results.length === 0){
            showNoResults();
            resultsCount.textContent = "No results found";
        }else{
            displayResults(results);
            resultsCount.textContent = `Found ${results.length} record${results.length > 1 ? 's' : ''}`;
        }
    }, 600);
}

// ================== SHOW LOADING STATE ==================
function showLoading(){
    const table = document.getElementById("resultTable");
    table.innerHTML = `
        <tr>
            <td colspan="4" class="loading-state">
                <div class="loading-spinner"></div>
                <h3>Processing Search...</h3>
                <p>Searching through records</p>
            </td>
        </tr>`;
}

// ================== SHOW NO RESULTS ==================
function showNoResults(){
    const table = document.getElementById("resultTable");
    table.innerHTML = `
        <tr>
            <td colspan="4" class="error-state">
                <div class="error-icon">❌</div>
                <h3>No Record Found</h3>
                <p>No matching CNIC found in the database</p>
            </td>
        </tr>`;
}

// ================== SHOW ERROR ==================
function showError(message){
    const table = document.getElementById("resultTable");
    table.innerHTML = `
        <tr>
            <td colspan="4" class="error-state">
                <div class="error-icon">⚠️</div>
                <h3>Error</h3>
                <p>${message}</p>
            </td>
        </tr>`;
}

// ================== DISPLAY RESULTS ==================
function displayResults(results){
    const table = document.getElementById("resultTable");
    
    let html = `
    <tr>
        <th>Applicant CNIC</th>
        <th>Applicant Name</th>
        <th>Business Sub Sector</th>
        <th>MFI Bank Name</th>
    </tr>`;
    
    results.forEach((r, index)=>{
        html += `
        <tr style="animation-delay:${0.1 + (index * 0.1)}s">
            <td>${r[0] || "-"}</td>
            <td>${r[1] || "-"}</td>
            <td>${r[2] || "-"}</td>
            <td>${r[3] || "-"}</td>
        </tr>`;
    });
    
    table.innerHTML = html;
}

// ================== CNIC AUTO-FORMATTING ==================
document.getElementById("cnic").addEventListener("input", e=>{
    let v = e.target.value.replace(/\D/g,"").slice(0,13);
    if(v.length>5) v = v.slice(0,5)+"-"+v.slice(5);
    if(v.length>13) v = v.slice(0,13)+"-"+v.slice(13);
    e.target.value = v;
});

// ================== KEYBOARD SUPPORT - ENTER KEY ==================
document.getElementById("cnic").addEventListener("keypress", e=>{
    if(e.key === "Enter"){
        e.preventDefault();
        searchData();
    }
});

// ================== KEYBOARD SUPPORT - ESC KEY TO CLEAR ==================
document.getElementById("cnic").addEventListener("keydown", e=>{
    if(e.key === "Escape"){
        e.target.value = "";
        e.target.focus();
    }
});
</script>

</body>
</html>
