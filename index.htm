<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMYBLS Smart Search</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
/* ===== SAME SMART THEME ===== */
:root{
    --bg-primary:#0d1117;
    --bg-card:#161b22;
    --accent:#22d3ee;
    --accent2:#8b5cf6;
    --text:#e6edf3;
    --muted:#8b949e;
    --border:#30363d;
}
body{margin:0;background:var(--bg-primary);color:var(--text);font-family:'DM Sans',sans-serif;}
.container{max-width:1300px;margin:auto;padding:40px 20px;}
.header{text-align:center;margin-bottom:40px;}
.header h1{font-family:'Syne';font-size:3rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:25px;margin-bottom:30px;}
input{width:100%;padding:16px;border-radius:12px;border:1px solid var(--border);background:#0f172a;color:white;font-family:'JetBrains Mono';font-size:1.1rem;}
button{margin-top:15px;padding:14px 30px;border:none;border-radius:12px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));color:white;cursor:pointer;}
button:hover{transform:translateY(-3px);}
.status{color:var(--muted);}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{padding:14px;border-bottom:1px solid var(--border);}
th{color:var(--accent);text-transform:uppercase;font-size:.85rem;}
.tool-btn{margin:5px;padding:12px 18px;border-radius:10px;background:#21262d;border:1px solid var(--border);cursor:pointer;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center;}
.modal.active{display:flex;}
.modal-content{background:var(--bg-card);padding:30px;border-radius:16px;width:90%;max-width:600px;}
textarea{width:100%;min-height:150px;background:#0f172a;color:white;border:1px solid var(--border);border-radius:10px;padding:10px;}
</style>
</head>
<body>
<div class="container">

<div class="header">
    <h1>Youth Business Search</h1>
    <p>Advanced CNIC Search</p>
</div>

<div class="card">
    <div id="status" class="status">🔄 Connecting to database...</div>
</div>

<div class="card">
    <input type="text" id="cnic" placeholder="Enter CNIC (13 digits)">
    <button onclick="searchData()">Search</button>
</div>

<div class="card">
    <div class="tool-btn" onclick="startScanner()">📷 Scan QR/Barcode</div>
    <div class="tool-btn" onclick="startOCR()">📸 Extract from Photo</div>
    <div class="tool-btn" onclick="startVoice()">🎤 Voice Search</div>
    <div class="tool-btn" onclick="openBulkModal()">📋 Bulk Search</div>
</div>

<div class="card" id="resultsCard" style="display:none;">
    <table id="resultTable"></table>
</div>

</div>

<!-- BULK MODAL -->
<div class="modal" id="bulkModal">
  <div class="modal-content">
    <h3>Bulk CNIC Search</h3>
    <textarea id="bulkCNICs" placeholder="Enter CNICs (one per line)"></textarea>
    <button onclick="bulkSearch()">Search All</button>
    <button onclick="closeBulkModal()">Close</button>
  </div>
</div>

<script>
// ===== CONFIG =====
const SHEET_ID = "PASTE_YOUR_SHEET_ID_HERE";
const SHEET_NAME = "Sheet1";

let excelData = [];
let currentResults = [];
let recognition;

// ===== LOAD SHEET FAST (CSV) =====
window.onload = async () => {
    try{
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
        const res = await fetch(url);
        const text = await res.text();
        excelData = text.split("\n").map(r=>r.split(",").map(c=>c.replace(/^"|"$/g,"").trim()));
        document.getElementById("status").innerHTML = `✅ Connected • ${excelData.length-1} records loaded`;
    }catch{
        document.getElementById("status").innerHTML = "❌ Failed to load Google Sheet";
    }
};

// ===== SEARCH =====
function normalize(v){return String(v||"").replace(/\D/g,"");}

function searchData(){
    const input = normalize(document.getElementById("cnic").value);
    if(input.length!==13) return alert("Enter valid CNIC");

    const rows = excelData.slice(1);
    const results = rows.filter(r=>normalize(r[0])===input);
    displayResults(results);
}

function displayResults(results){
    const card = document.getElementById("resultsCard");
    const table = document.getElementById("resultTable");
    card.style.display="block";

    if(results.length===0){
        table.innerHTML = `<tr><td colspan="4">❌ No record found</td></tr>`;
        return;
    }

    let html=`<tr><th>CNIC</th><th>Name</th><th>Business Sector</th><th>MFI Bank</th></tr>`;
    results.forEach(r=>{
        html+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
    });
    table.innerHTML=html;
    currentResults = results;
}

// ===== BULK SEARCH =====
function openBulkModal(){document.getElementById("bulkModal").classList.add("active");}
function closeBulkModal(){document.getElementById("bulkModal").classList.remove("active");}

function bulkSearch(){
    const cnics = document.getElementById("bulkCNICs").value.split("\n").map(normalize).filter(c=>c.length===13);
    const rows = excelData.slice(1);
    const results = rows.filter(r=>cnics.includes(normalize(r[0])));
    closeBulkModal();
    displayResults(results);
}

// ===== VOICE SEARCH =====
function startVoice(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return alert("Voice not supported");

    recognition = new SpeechRecognition();
    recognition.onresult = e=>{
        const digits = normalize(e.results[0][0].transcript);
        if(digits.length>=13){
            document.getElementById("cnic").value = digits.slice(0,13);
            searchData();
        }
    };
    recognition.start();
}

// ===== QR SCANNER =====
function startScanner(){
    alert("QR Scanner requires camera access — keep using your previous QR section here.");
}

// ===== OCR =====
function startOCR(){
    alert("OCR feature retained — integrate your previous OCR modal here.");
}
</script>
</body>
</html>
