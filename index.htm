<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Minister Youth Business & Agriculture</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- Libraries -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#2563eb;
    --primary-light:#3b82f6;
    --primary-dark:#1e40af;
    --bg-primary:#f8fafc;
    --bg-secondary:#ffffff;
    --bg-card:#ffffff;
    --text-primary:#0f172a;
    --text-secondary:#64748b;
    --border:#e2e8f0;
    --shadow:rgba(0,0,0,0.08);
    --success:#10b981;
    --error:#ef4444;
}

body{
    background:linear-gradient(135deg, #f0f9ff 0%, #ffffff 100%);
    color:var(--text-primary);
    font-family:'Inter', sans-serif;
    min-height:100vh;
}

.container{
    max-width:1300px;
    margin:0 auto;
    padding:30px 20px;
}

/* Header */
.header{
    text-align:center;
    margin-bottom:40px;
    animation:fadeInDown 0.6s ease-out;
}

@keyframes fadeInDown{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.header h1{
    font-size:2.5rem;
    font-weight:800;
    background:linear-gradient(135deg, var(--primary), var(--primary-light));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:8px;
    letter-spacing:-0.5px;
}

.header p{
    color:var(--text-secondary);
    font-size:1rem;
    font-weight:400;
}

/* Data Status Card */
.data-status{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 25px;
    margin-bottom:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    animation:fadeInUp 0.6s ease-out 0.2s both;
    box-shadow:0 4px 16px var(--shadow);
}

@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.data-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.data-icon{
    width:50px;
    height:50px;
    background:linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 4px 12px rgba(37,99,235,0.2);
}

.data-details h3{
    font-size:1rem;
    font-weight:600;
    margin-bottom:4px;
    color:var(--text-primary);
}

.data-details p{
    color:var(--text-secondary);
    font-size:0.85rem;
    font-family:'Space Mono', monospace;
}

.data-badge{
    padding:8px 16px;
    background:rgba(16,185,129,0.1);
    color:var(--success);
    border-radius:20px;
    font-size:0.85rem;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(16,185,129,0.2);
}

.data-badge.loading{
    background:rgba(37,99,235,0.1);
    color:var(--primary);
    border-color:rgba(37,99,235,0.2);
}

.data-badge.error{
    background:rgba(239,68,68,0.1);
    color:var(--error);
    border-color:rgba(239,68,68,0.2);
}

.spinner{
    width:16px;
    height:16px;
    border:2px solid transparent;
    border-top-color:currentColor;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* Search Card */
.search-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:35px;
    margin-bottom:35px;
    animation:fadeInUp 0.6s ease-out 0.4s both;
    box-shadow:0 4px 16px var(--shadow);
}

.search-form{
    display:flex;
    gap:15px;
    align-items:stretch;
    margin-bottom:25px;
}

.input-wrapper{
    flex:1;
    position:relative;
}

.input-wrapper input{
    width:100%;
    padding:16px 22px;
    font-size:1.1rem;
    font-family:'Space Mono', monospace;
    background:var(--bg-primary);
    border:2px solid var(--border);
    border-radius:12px;
    color:var(--text-primary);
    transition:all 0.3s ease;
    font-weight:500;
}

.input-wrapper input:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(37,99,235,0.1);
    background:var(--bg-secondary);
}

.input-wrapper input::placeholder{
    color:var(--text-secondary);
    font-weight:400;
}

.search-btn{
    padding:16px 40px;
    font-size:1rem;
    font-weight:700;
    background:linear-gradient(135deg, var(--primary), var(--primary-light));
    border:none;
    border-radius:12px;
    color:white;
    cursor:pointer;
    transition:all 0.3s ease;
    box-shadow:0 4px 12px rgba(37,99,235,0.3);
}

.search-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(37,99,235,0.4);
}

.search-btn:active{
    transform:translateY(0);
}

.search-btn:disabled{
    pointer-events:none;
    opacity:0.7;
}

/* Tools Section */
.tools-label{
    font-size:0.85rem;
    font-weight:600;
    color:var(--text-secondary);
    margin-bottom:15px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.tools-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:12px;
}

.tool-btn{
    padding:16px 20px;
    background:var(--bg-primary);
    border:2px solid var(--border);
    border-radius:12px;
    cursor:pointer;
    transition:all 0.3s ease;
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:600;
    color:var(--text-primary);
    font-size:0.9rem;
}

.tool-btn .icon{
    font-size:24px;
}

.tool-btn .label{
    flex:1;
    text-align:left;
}

.tool-btn .label-small{
    font-size:0.75rem;
    color:var(--text-secondary);
    font-weight:400;
    margin-top:2px;
}

.tool-btn:hover{
    border-color:var(--primary);
    background:var(--bg-secondary);
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(37,99,235,0.15);
}

.tool-btn.listening{
    border-color:var(--error);
    background:rgba(239,68,68,0.05);
}

/* Results Section */
.results-section{
    margin-top:40px;
    animation:fadeInUp 0.6s ease-out 0.6s both;
}

.results-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.results-count{
    font-size:1.3rem;
    font-weight:700;
    color:var(--text-primary);
}

.export-btns{
    display:flex;
    gap:10px;
}

.export-btn{
    padding:10px 18px;
    background:var(--bg-primary);
    border:2px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    font-size:0.9rem;
    color:var(--text-primary);
    transition:all 0.3s ease;
    display:flex;
    align-items:center;
    gap:8px;
}

.export-btn:hover{
    border-color:var(--primary);
    background:var(--bg-secondary);
    transform:translateY(-2px);
}

/* Results Table */
.results-table-container{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 16px var(--shadow);
}

.results-table{
    width:100%;
    border-collapse:collapse;
}

.results-table thead{
    background:linear-gradient(135deg, var(--primary), var(--primary-light));
}

.results-table th{
    padding:18px 20px;
    text-align:left;
    color:white;
    font-weight:600;
    font-size:0.95rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
}

.results-table tbody tr{
    border-bottom:1px solid var(--border);
    transition:all 0.2s ease;
}

.results-table tbody tr:hover{
    background:var(--bg-primary);
}

.results-table tbody tr:last-child{
    border-bottom:none;
}

.results-table td{
    padding:18px 20px;
    color:var(--text-primary);
    font-size:0.95rem;
}

.results-table td:first-child{
    font-family:'Space Mono', monospace;
    font-weight:600;
    color:var(--primary);
}

/* No Results */
.no-results{
    text-align:center;
    padding:80px 40px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 4px 16px var(--shadow);
}

.no-results-icon{
    font-size:80px;
    margin-bottom:20px;
    opacity:0.3;
}

.no-results h3{
    font-size:1.5rem;
    font-weight:700;
    color:var(--text-primary);
    margin-bottom:10px;
}

.no-results p{
    color:var(--text-secondary);
    font-size:1rem;
    line-height:1.6;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:1000;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(4px);
}

.modal.active{
    display:flex;
}

.modal-content{
    background:var(--bg-card);
    border-radius:20px;
    padding:40px;
    width:90%;
    max-width:600px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    animation:modalSlideIn 0.3s ease-out;
}

@keyframes modalSlideIn{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.modal-header h2{
    font-size:1.8rem;
    font-weight:700;
    color:var(--text-primary);
}

.modal-close{
    font-size:32px;
    cursor:pointer;
    color:var(--text-secondary);
    transition:all 0.2s ease;
    line-height:1;
}

.modal-close:hover{
    color:var(--error);
    transform:rotate(90deg);
}

.modal-body textarea{
    width:100%;
    min-height:200px;
    padding:16px;
    font-family:'Space Mono', monospace;
    font-size:0.95rem;
    background:var(--bg-primary);
    border:2px solid var(--border);
    border-radius:12px;
    color:var(--text-primary);
    resize:vertical;
    margin-bottom:20px;
}

.modal-body textarea:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(37,99,235,0.1);
}

.modal-footer{
    display:flex;
    gap:12px;
    justify-content:flex-end;
}

.modal-btn{
    padding:12px 28px;
    font-size:1rem;
    font-weight:600;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:all 0.3s ease;
}

.modal-btn.primary{
    background:linear-gradient(135deg, var(--primary), var(--primary-light));
    color:white;
    box-shadow:0 4px 12px rgba(37,99,235,0.3);
}

.modal-btn.primary:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(37,99,235,0.4);
}

.modal-btn.secondary{
    background:var(--bg-primary);
    color:var(--text-primary);
    border:2px solid var(--border);
}

.modal-btn.secondary:hover{
    background:var(--bg-secondary);
    border-color:var(--primary);
}

/* Scanner Container */
.scanner-container{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    z-index:2000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.scanner-container.active{
    display:flex;
}

.scanner-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    max-width:600px;
    margin-bottom:20px;
}

.scanner-title{
    color:white;
    font-size:1.5rem;
    font-weight:700;
}

.scanner-close{
    background:rgba(255,255,255,0.1);
    border:2px solid rgba(255,255,255,0.3);
    color:white;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:all 0.3s ease;
}

.scanner-close:hover{
    background:rgba(255,255,255,0.2);
    border-color:rgba(255,255,255,0.5);
}

#qr-reader{
    width:100%;
    max-width:600px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* OCR Container */
.ocr-container{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    z-index:2000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.ocr-container.active{
    display:flex;
}

.ocr-content{
    width:100%;
    max-width:600px;
}

.ocr-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.ocr-title{
    color:white;
    font-size:1.5rem;
    font-weight:700;
}

.ocr-close{
    background:rgba(255,255,255,0.1);
    border:2px solid rgba(255,255,255,0.3);
    color:white;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:all 0.3s ease;
}

.ocr-close:hover{
    background:rgba(255,255,255,0.2);
    border-color:rgba(255,255,255,0.5);
}

.ocr-upload{
    background:rgba(255,255,255,0.05);
    border:3px dashed rgba(255,255,255,0.3);
    border-radius:16px;
    padding:60px 40px;
    text-align:center;
    cursor:pointer;
    transition:all 0.3s ease;
    margin-bottom:30px;
}

.ocr-upload:hover{
    background:rgba(255,255,255,0.1);
    border-color:rgba(255,255,255,0.5);
}

.ocr-upload-icon{
    font-size:64px;
    margin-bottom:20px;
}

.ocr-upload-text{
    color:white;
    font-size:1.2rem;
    font-weight:600;
    margin-bottom:8px;
}

.ocr-upload-hint{
    color:rgba(255,255,255,0.6);
    font-size:0.95rem;
}

#ocrFileInput{
    display:none;
}

.ocr-preview{
    display:none;
    margin-bottom:30px;
}

.ocr-preview.active{
    display:block;
}

.ocr-preview img{
    width:100%;
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.ocr-progress{
    background:rgba(255,255,255,0.1);
    border-radius:12px;
    padding:20px;
    display:none;
}

.ocr-progress.active{
    display:block;
}

.ocr-progress-text{
    color:white;
    font-size:1rem;
    font-weight:600;
    margin-bottom:12px;
    text-align:center;
}

.ocr-progress-bar{
    background:rgba(255,255,255,0.2);
    border-radius:20px;
    height:12px;
    overflow:hidden;
}

.ocr-progress-fill{
    background:linear-gradient(90deg, var(--primary), var(--primary-light));
    height:100%;
    width:0%;
    transition:width 0.3s ease;
    border-radius:20px;
}

/* Responsive */
@media(max-width:768px){
    .header h1{
        font-size:1.8rem;
    }
    
    .search-form{
        flex-direction:column;
    }
    
    .tools-grid{
        grid-template-columns:1fr;
    }
    
    .results-header{
        flex-direction:column;
        gap:15px;
        align-items:flex-start;
    }
    
    .export-btns{
        width:100%;
        flex-wrap:wrap;
    }
    
    .export-btn{
        flex:1;
        min-width:120px;
        justify-content:center;
    }
    
    .results-table{
        font-size:0.85rem;
    }
    
    .results-table th,
    .results-table td{
        padding:12px;
    }
}
</style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>Prime Minister Youth Business & Agriculture</h1>
        <p>CNIC Search System</p>
    </div>
    
    <!-- Data Status -->
    <div class="data-status">
        <div class="data-info">
            <div class="data-icon">📊</div>
            <div class="data-details">
                <h3>Database Status</h3>
                <p id="dataCount">Loading database...</p>
            </div>
        </div>
        <div class="data-badge loading" id="dataBadge">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>
    
    <!-- Search Card -->
    <div class="search-card">
        <form class="search-form" onsubmit="event.preventDefault(); searchData();">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="cnic" 
                    placeholder="Enter CNIC (e.g., 12345-1234567-1)" 
                    maxlength="15"
                    autocomplete="off"
                >
            </div>
            <button type="submit" class="search-btn" id="searchBtn">
                🔍 Search
            </button>
        </form>
        
        <div class="tools-label">Advanced Search Tools</div>
        <div class="tools-grid">
            <button class="tool-btn" onclick="startQRScan()">
                <span class="icon">📷</span>
                <div class="label">
                    QR Scanner
                    <div class="label-small">Scan CNIC QR Code</div>
                </div>
            </button>
            
            <button class="tool-btn" onclick="startOCR()">
                <span class="icon">🖼️</span>
                <div class="label">
                    OCR Scanner
                    <div class="label-small">Extract from Image</div>
                </div>
            </button>
            
            <button class="tool-btn" id="voiceBtn" onclick="startVoice()">
                <span class="icon" id="voiceIcon">🎤</span>
                <div class="label">
                    <span id="voiceText">Voice Input</span>
                    <div class="label-small">Speak CNIC Number</div>
                </div>
            </button>
            
            <button class="tool-btn" onclick="openBulkModal()">
                <span class="icon">📋</span>
                <div class="label">
                    Bulk Search
                    <div class="label-small">Search Multiple CNICs</div>
                </div>
            </button>
        </div>
    </div>
    
    <!-- Results Section -->
    <div class="results-section" id="resultsSection" style="display:none;">
        <div class="results-header">
            <div class="results-count" id="resultsCount">Search results will appear here</div>
            <div class="export-btns">
                <button class="export-btn" onclick="copyResults()" title="Copy to Clipboard">
                    📋 Copy
                </button>
                <button class="export-btn" onclick="exportExcel()" title="Export to Excel">
                    📊 Excel
                </button>
                <button class="export-btn" onclick="exportPDF()" title="Export to PDF">
                    📄 PDF
                </button>
                <button class="export-btn" onclick="printResults()" title="Print Results">
                    🖨️ Print
                </button>
                <button class="export-btn" onclick="shareResults()" title="Share Results">
                    📤 Share
                </button>
            </div>
        </div>
        
        <div class="results-table-container" id="resultsContainer"></div>
    </div>
</div>

<!-- Bulk Search Modal -->
<div class="modal" id="bulkModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📋 Bulk Search</h2>
            <div class="modal-close" onclick="closeBulkModal()">×</div>
        </div>
        <div class="modal-body">
            <textarea 
                id="bulkCNICs" 
                placeholder="Enter CNICs (one per line):&#10;12345-1234567-1&#10;54321-7654321-3&#10;..."
            ></textarea>
        </div>
        <div class="modal-footer">
            <button class="modal-btn secondary" onclick="closeBulkModal()">Cancel</button>
            <button class="modal-btn primary" onclick="bulkSearch()">🔍 Search All</button>
        </div>
    </div>
</div>

<!-- QR Scanner Container -->
<div class="scanner-container" id="scannerContainer">
    <div class="scanner-header">
        <div class="scanner-title">📷 QR Code Scanner</div>
        <button class="scanner-close" onclick="stopQRScan()">Close</button>
    </div>
    <div id="qr-reader"></div>
</div>

<!-- OCR Container -->
<div class="ocr-container" id="ocrContainer">
    <div class="ocr-content">
        <div class="ocr-header">
            <div class="ocr-title">🖼️ OCR Scanner</div>
            <button class="ocr-close" onclick="stopOCR()">Close</button>
        </div>
        
        <div class="ocr-upload" onclick="document.getElementById('ocrFileInput').click()">
            <div class="ocr-upload-icon">📸</div>
            <div class="ocr-upload-text">Upload CNIC Image</div>
            <div class="ocr-upload-hint">Click to select image (JPG, PNG)</div>
        </div>
        <input type="file" id="ocrFileInput" accept="image/*" onchange="processOCR(event)">
        
        <div class="ocr-preview" id="ocrPreview">
            <img id="ocrImage" alt="CNIC Preview">
        </div>
        
        <div class="ocr-progress" id="ocrProgress">
            <div class="ocr-progress-text" id="ocrProgressText">Initializing...</div>
            <div class="ocr-progress-bar">
                <div class="ocr-progress-fill" id="ocrProgressFill"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ================== GLOBAL STATE ==================
let excelData = [];
let currentResults = [];
let html5QrCode = null;
let recognition = null;

// ================== INITIALIZE ==================
window.addEventListener('load', () => {
    loadExcelData();
});

// ================== LOAD EXCEL DATA ==================
function loadExcelData(){
    const badge = document.getElementById('dataBadge');
    const count = document.getElementById('dataCount');
    
    badge.className = 'data-badge loading';
    badge.innerHTML = '<div class="spinner"></div><span>Loading...</span>';
    count.textContent = 'Fetching database...';
    
    fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3K6b6NIfFh0GbhDdGYCz9u7tD1W_hK_P6c5uMUKIuZUxz_8eMLM3VQ8kOxg9TZoWtN-5HtMO6Wk7c/pub?output=xlsx')
    .then(res => {
        if(!res.ok) throw new Error('Network error');
        return res.arrayBuffer();
    })
    .then(data => {
        const workbook = XLSX.read(data, {type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        excelData = XLSX.utils.sheet_to_json(sheet, {header:1});
        
        const recordCount = (excelData.length - 1).toLocaleString();
        
        badge.className = 'data-badge';
        badge.innerHTML = '<span>✓ Ready</span>';
        count.textContent = `${recordCount} records loaded`;
    })
    .catch(err => {
        console.error('Load Error:', err);
        badge.className = 'data-badge error';
        badge.innerHTML = '<span>✗ Failed</span>';
        count.textContent = 'Failed to load database';
    });
}

// ================== SEARCH FUNCTION ==================
function searchData(){
    const input = document.getElementById('cnic').value.trim();
    const btn = document.getElementById('searchBtn');
    
    if(!input){
        alert('Please enter a CNIC number');
        return;
    }
    
    if(excelData.length === 0){
        alert('Database is still loading. Please wait...');
        return;
    }
    
    // Disable button during search
    btn.disabled = true;
    btn.textContent = '🔍 Searching...';
    
    const normalized = normalize(input);
    
    // Use setTimeout to prevent UI freezing
    setTimeout(() => {
        try {
            const rows = excelData.slice(1);
            const results = rows.filter(row => normalize(row[0]) === normalized);
            
            if(results.length === 0){
                showNoResults();
                document.getElementById('resultsCount').textContent = "No record found for CNIC: " + input;
            }else{
                currentResults = results;
                displayResults(results);
                document.getElementById('resultsCount').textContent = `Found ${results.length} record${results.length > 1 ? 's' : ''}`;
            }
        } catch(err) {
            console.error('Search Error:', err);
            alert('An error occurred during search. Please try again.');
        } finally {
            // Re-enable button
            btn.disabled = false;
            btn.textContent = '🔍 Search';
        }
    }, 100);
}

function normalize(cnic){
    return (cnic || '').toString().replace(/\D/g, '');
}

function displayResults(results){
    const section = document.getElementById('resultsSection');
    const container = document.getElementById('resultsContainer');
    
    let html = '<table class="results-table"><thead><tr>';
    html += '<th>CNIC</th><th>Name</th><th>Business Sector</th><th>MFI Bank</th>';
    html += '</tr></thead><tbody>';
    
    results.forEach(row => {
        html += '<tr>';
        html += `<td>${row[0] || '-'}</td>`;
        html += `<td>${row[1] || '-'}</td>`;
        html += `<td>${row[2] || '-'}</td>`;
        html += `<td>${row[3] || '-'}</td>`;
        html += '</tr>';
    });
    
    html += '</tbody></table>';
    
    container.innerHTML = html;
    section.style.display = 'block';
    
    container.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function showNoResults(){
    const section = document.getElementById('resultsSection');
    const container = document.getElementById('resultsContainer');
    
    container.innerHTML = `
        <div class="no-results">
            <div class="no-results-icon">🔍</div>
            <h3>No Record Found</h3>
            <p>The CNIC you entered is not in the database.<br>Please verify the number and try again.</p>
        </div>
    `;
    
    section.style.display = 'block';
    currentResults = [];
    
    container.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ================== QR SCANNER ==================
function startQRScan(){
    const container = document.getElementById('scannerContainer');
    container.classList.add('active');
    
    html5QrCode = new Html5Qrcode("qr-reader");
    
    Html5Qrcode.getCameras().then(cameras => {
        if(cameras && cameras.length > 0){
            const cameraId = cameras[cameras.length > 1 ? 1 : 0].id;
            
            html5QrCode.start(
                cameraId,
                {fps:10, qrbox:{width:250, height:250}},
                (decoded) => {
                    const cnic = decoded.replace(/\D/g, '');
                    if(cnic.length >= 13){
                        fillCNIC(cnic.slice(0, 13));
                        stopQRScan();
                        setTimeout(() => searchData(), 500);
                    }
                },
                () => {}
            ).catch(err => {
                console.error('QR Start Error:', err);
                alert('Failed to start camera. Please check permissions.');
                stopQRScan();
            });
        }else{
            alert('No camera found');
            stopQRScan();
        }
    }).catch(err => {
        console.error('Camera Error:', err);
        alert('Camera access denied or unavailable');
        stopQRScan();
    });
}

function stopQRScan(){
    if(html5QrCode){
        html5QrCode.stop().catch(() => {});
        html5QrCode = null;
    }
    document.getElementById('scannerContainer').classList.remove('active');
}

// ================== OCR SCANNER ==================
function startOCR(){
    document.getElementById('ocrContainer').classList.add('active');
    document.getElementById('ocrPreview').classList.remove('active');
    document.getElementById('ocrProgress').classList.remove('active');
}

function stopOCR(){
    document.getElementById('ocrContainer').classList.remove('active');
    document.getElementById('ocrFileInput').value = '';
    document.getElementById('ocrPreview').classList.remove('active');
    document.getElementById('ocrProgress').classList.remove('active');
}

async function processOCR(event){
    const file = event.target.files[0];
    if(!file) return;
    
    const preview = document.getElementById('ocrPreview');
    const image = document.getElementById('ocrImage');
    const progress = document.getElementById('ocrProgress');
    const fill = document.getElementById('ocrProgressFill');
    const text = document.getElementById('ocrProgressText');
    
    const reader = new FileReader();
    reader.onload = (e) => {
        image.src = e.target.result;
        preview.classList.add('active');
    };
    reader.readAsDataURL(file);
    
    progress.classList.add('active');
    fill.style.width = '0%';
    text.textContent = 'Initializing OCR...';
    
    try{
        const result = await Tesseract.recognize(
            file,
            'eng',
            {
                logger: m => {
                    if(m.status === 'recognizing text'){
                        const percent = Math.round(m.progress * 90) + 10;
                        fill.style.width = percent + '%';
                        text.textContent = `Processing... ${percent}%`;
                    }
                }
            }
        );
        
        fill.style.width = '100%';
        text.textContent = 'Extracting CNIC...';
        
        const extractedText = result.data.text;
        const patterns = [
            /\d{5}[\s-]?\d{7}[\s-]?\d/g,
            /\d{13}/g
        ];
        
        let cnic = null;
        for(let pattern of patterns){
            const matches = extractedText.match(pattern);
            if(matches){
                cnic = matches[0].replace(/\D/g, '');
                if(cnic.length >= 13){
                    cnic = cnic.slice(0, 13);
                    break;
                }
            }
        }
        
        if(cnic && cnic.length === 13){
            fill.style.width = '100%';
            text.textContent = '✓ CNIC Found!';
            
            setTimeout(() => {
                fillCNIC(cnic);
                stopOCR();
                setTimeout(() => searchData(), 500);
            }, 1000);
        }else{
            text.textContent = '❌ No valid CNIC found. Please try again.';
            fill.style.width = '0%';
        }
        
    }catch(err){
        console.error('OCR Error:', err);
        text.textContent = '❌ Processing failed. Please try again.';
        fill.style.width = '0%';
    }
}

// ================== VOICE SEARCH ==================
function startVoice(){
    if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
        alert('Voice recognition not supported in this browser.\n\nSupported browsers:\n• Chrome\n• Edge\n• Safari (iOS 14.5+)');
        return;
    }
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceIcon = document.getElementById('voiceIcon');
    const voiceText = document.getElementById('voiceText');
    
    voiceBtn.classList.add('listening');
    voiceIcon.textContent = '🎙️';
    voiceText.textContent = 'Listening...';
    
    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        
        const digitMap = {
            'zero': '0', 'one': '1', 'two': '2', 'three': '3', 'four': '4',
            'five': '5', 'six': '6', 'seven': '7', 'eight': '8', 'nine': '9',
            'to': '2', 'for': '4', 'too': '2'
        };
        
        let digits = transcript.replace(/[^\d]/g, '');
        
        const words = transcript.split(/\s+/);
        words.forEach(word => {
            if(digitMap[word]) digits += digitMap[word];
        });
        
        if(digits.length >= 13){
            const cnic = digits.slice(0, 13);
            fillCNIC(cnic);
            setTimeout(() => searchData(), 500);
        }else if(digits.length > 0){
            alert(`Captured ${digits.length} digits. Please speak all 13 digits clearly.`);
        }
        
        voiceBtn.classList.remove('listening');
        voiceIcon.textContent = '🎤';
        voiceText.textContent = 'Voice Input';
    };
    
    recognition.onerror = (event) => {
        voiceBtn.classList.remove('listening');
        voiceIcon.textContent = '🎤';
        voiceText.textContent = 'Voice Input';
        
        let errorMsg = 'Voice recognition failed.';
        if(event.error === 'no-speech'){
            errorMsg = 'No speech detected. Please try again.';
        }else if(event.error === 'not-allowed'){
            errorMsg = 'Microphone permission denied.';
        }
        alert(errorMsg);
    };
    
    recognition.onend = () => {
        voiceBtn.classList.remove('listening');
        voiceIcon.textContent = '🎤';
        voiceText.textContent = 'Voice Input';
    };
    
    recognition.start();
}

// ================== BULK SEARCH ==================
function openBulkModal(){
    document.getElementById('bulkModal').classList.add('active');
}

function closeBulkModal(){
    document.getElementById('bulkModal').classList.remove('active');
}

function bulkSearch(){
    const cnics = document.getElementById('bulkCNICs').value
        .split('\n')
        .map(c => normalize(c))
        .filter(c => c.length === 13);
    
    if(cnics.length === 0){
        alert('Please enter valid CNICs');
        return;
    }
    
    const rows = excelData.slice(1);
    const results = rows.filter(r => cnics.includes(normalize(r[0])));
    
    closeBulkModal();
    
    if(results.length === 0){
        showNoResults();
        document.getElementById('resultsCount').textContent = "No results found";
    }else{
        currentResults = results;
        displayResults(results);
        document.getElementById('resultsCount').textContent = `Found ${results.length} of ${cnics.length} CNICs`;
    }
}

// ================== EXPORT FUNCTIONS ==================
function copyResults(){
    if(currentResults.length === 0){
        alert('No results to copy');
        return;
    }
    
    const headers = ['CNIC', 'Name', 'Business Sector', 'MFI Bank'];
    let text = '';
    
    headers.forEach((header, index) => {
        text += header;
        currentResults.forEach(r => {
            text += '\t' + (r[index] || '-');
        });
        text += '\n';
    });
    
    navigator.clipboard.writeText(text).then(() => {
        alert('✓ Results copied to clipboard');
    }).catch(() => {
        alert('Failed to copy');
    });
}

function exportExcel(){
    if(currentResults.length === 0){
        alert('No results to export');
        return;
    }
    
    const ws = XLSX.utils.aoa_to_sheet([
        ['Applicant CNIC', 'Applicant Name', 'Business Sub Sector', 'MFI Bank Name'],
        ...currentResults
    ]);
    
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Results');
    XLSX.writeFile(wb, `PMYBA_Results_${Date.now()}.xlsx`);
}

function exportPDF(){
    if(currentResults.length === 0){
        alert('No results to export');
        return;
    }
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    doc.setFontSize(16);
    doc.text('PM Youth Business & Agriculture', 14, 20);
    doc.setFontSize(12);
    doc.text('Search Results', 14, 28);
    
    doc.autoTable({
        head: [['CNIC', 'Name', 'Business Sector', 'MFI Bank']],
        body: currentResults,
        startY: 35
    });
    
    doc.save(`PMYBA_Results_${Date.now()}.pdf`);
}

function printResults(){
    if(currentResults.length === 0){
        alert('No results to print');
        return;
    }
    
    const printWindow = window.open('', '', 'height=600,width=800');
    printWindow.document.write('<html><head><title>Print Results</title>');
    printWindow.document.write('<style>body{font-family:Arial;padding:20px;}h2{margin-bottom:10px;}h3{color:#666;font-weight:400;margin-bottom:20px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:12px;text-align:left;}th{background:#2563eb;color:white;font-weight:600;}</style>');
    printWindow.document.write('</head><body>');
    printWindow.document.write('<h2>Prime Minister Youth Business & Agriculture</h2>');
    printWindow.document.write('<h3>Search Results</h3>');
    printWindow.document.write('<table><thead><tr><th>CNIC</th><th>Name</th><th>Business Sector</th><th>MFI Bank</th></tr></thead><tbody>');
    
    currentResults.forEach(r => {
        printWindow.document.write(`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`);
    });
    
    printWindow.document.write('</tbody></table></body></html>');
    printWindow.document.close();
    printWindow.print();
}

function shareResults(){
    if(currentResults.length === 0){
        alert('No results to share');
        return;
    }
    
    if(navigator.share){
        navigator.share({
            title: 'PM Youth Business & Agriculture Results',
            text: `Found ${currentResults.length} record${currentResults.length > 1 ? 's' : ''}`
        }).catch(() => {});
    }else{
        alert('Share feature not supported in this browser');
    }
}

// ================== HELPER FUNCTIONS ==================
function fillCNIC(cnic){
    document.getElementById('cnic').value = formatCNIC(cnic);
}

function formatCNIC(cnic){
    let formatted = cnic;
    if(formatted.length > 5) formatted = formatted.slice(0, 5) + "-" + formatted.slice(5);
    if(formatted.length > 13) formatted = formatted.slice(0, 13) + "-" + formatted.slice(13);
    return formatted;
}

// ================== CNIC AUTO-FORMATTING ==================
document.getElementById("cnic").addEventListener("input", e => {
    let v = e.target.value.replace(/\D/g,"").slice(0,13);
    if(v.length>5) v = v.slice(0,5)+"-"+v.slice(5);
    if(v.length>13) v = v.slice(0,13)+"-"+v.slice(13);
    e.target.value = v;
});

// ================== KEYBOARD SUPPORT ==================
document.getElementById("cnic").addEventListener("keypress", e => {
    if(e.key === "Enter"){
        e.preventDefault();
        searchData();
    }
});

document.getElementById("cnic").addEventListener("keydown", e => {
    if(e.key === "Escape"){
        e.target.value = "";
        e.target.focus();
    }
});
</script>
