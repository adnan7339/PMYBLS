<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMYBLS Search</title>

<style>
body{
    background:#0b1220;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}
.container{
    max-width:1100px;
    margin:auto;
    padding:30px;
}
h2{
    margin-bottom:20px;
}
input{
    padding:12px;
    width:260px;
    font-size:16px;
}
button{
    padding:12px 18px;
    font-size:16px;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}
th,td{
    border:1px solid #333;
    padding:12px;
}
th{
    background:#111827;
}
.no-data{
    text-align:center;
    padding:40px;
    color:#aaa;
}
</style>
</head>

<body>
<div class="container">

<h2>PMYBLS Applicant Search</h2>

<input type="text" id="cnic" placeholder="XXXXX-XXXXXXX-X" maxlength="15">
<button onclick="searchData()">Search</button>

<table id="resultTable">
<tbody>
<tr>
<td class="no-data" colspan="4">Enter CNIC and click Search</td>
</tr>
</tbody>
</table>

</div>

<script>
// ================== GOOGLE SHEET CONFIG ==================
const SHEET_ID   = "1n2_6Oewp88igcRv5H7vKYpYH-jHmnTus";
const SHEET_NAME = "Sheet1";

// ================== GLOBAL DATA ==================
let excelData = [];

// ================== LOAD DATA ==================
window.onload = loadData;

async function loadData(){
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
    const res = await fetch(url);
    const text = await res.text();
    excelData = parseCSV(text);
}

// ================== CSV PARSER ==================
function parseCSV(csv){
    const lines = csv.split("\n");
    return lines.map(line =>
        line.split(",").map(cell => cell.replace(/^"|"$/g,"").trim())
    );
}

// ================== NORMALIZE CNIC ==================
function normalize(val){
    return String(val || "").replace(/\D/g,"");
}

// ================== SEARCH ==================
function searchData(){
    const input = normalize(document.getElementById("cnic").value);
    const table = document.getElementById("resultTable");

    if(input.length !== 13){
        alert("Please enter valid 13 digit CNIC");
        return;
    }

    const rows = excelData.slice(1); // skip header
    const results = rows.filter(r => normalize(r[0]) === input);

    if(results.length === 0){
        table.innerHTML = `
        <tbody>
        <tr>
            <td class="no-data" colspan="4">No record found</td>
        </tr>
        </tbody>`;
        return;
    }

    let html = `
    <thead>
    <tr>
        <th>Applicant CNIC</th>
        <th>Applicant Name</th>
        <th>Business Sub Sector</th>
        <th>MFIBankName</th>
    </tr>
    </thead>
    <tbody>`;

    results.forEach(r=>{
        html += `
        <tr>
            <td>${r[0] || "-"}</td>
            <td>${r[1] || "-"}</td>
            <td>${r[2] || "-"}</td>
            <td>${r[3] || "-"}</td>
        </tr>`;
    });

    html += "</tbody>";
    table.innerHTML = html;
}

// ================== CNIC FORMAT ==================
document.getElementById("cnic").addEventListener("input", e=>{
    let v = e.target.value.replace(/\D/g,"").slice(0,13);
    if(v.length>5) v = v.slice(0,5)+"-"+v.slice(5);
    if(v.length>13) v = v.slice(0,13)+"-"+v.slice(13);
    e.target.value = v;
});
</script>

</body>
</html>
