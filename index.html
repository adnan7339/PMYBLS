<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PMY Applicant Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1>PMY Applicant Portal</h1>

  <div class="actions">
    <input type="file" id="fileInput" accept=".json">
    <input type="text" id="searchInput" placeholder="Search CNIC / Name / Bank">
  </div>
</header>

<section class="container">
  <table>
    <thead>
      <tr>
        <th>CNIC</th>
        <th>Name</th>
        <th>Industry</th>
        <th>Sector</th>
        <th>Sub Sector</th>
        <th>Bank</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</section>

<footer>
  Total Records: <span id="count">0</span>
</footer>

<script src="script.js"></script>
</body>
</html>
