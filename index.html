<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PM-YBLS Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:system-ui,Arial;
  background:linear-gradient(135deg,#020617,#1e3a8a);
  color:#e5e7eb;
  min-height:100vh;
}
.container{max-width:460px;margin:auto;padding:20px;}
.card{
  background:#020617;
  border-radius:14px;
  padding:24px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
h1{text-align:center;margin:0;}
.sub{text-align:center;color:#94a3b8;margin:6px 0 20px;}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb;
  font-size:15px;
}
input:focus{outline:2px solid #2563eb;}
button{
  background:#2563eb;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
button:hover{background:#1d4ed8;}
.hidden{display:none;}
.error{
  background:#7f1d1d;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px;
}
.nav{display:flex;gap:8px;margin:12px 0;}
.nav button{
  background:#020617;
  border:1px solid #334155;
}
.box{
  background:#020617;
  border:1px solid #1e293b;
  padding:14px;
  border-radius:10px;
  margin-top:12px;
}
.stat{
  background:#020617;
  border:1px solid #334155;
  padding:12px;
  border-radius:10px;
  text-align:center;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
  <div class="card">
    <h1>PM-YBLS</h1>
    <p class="sub">Secure Admin Login</p>

    <div id="loginError" class="error hidden"></div>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="container hidden">
  <div class="card">
    <h1>Dashboard</h1>

    <div class="stat">
      <div>Total Applicants</div>
      <h2 id="total">...</h2>
    </div>

    <div class="nav">
      <button onclick="showBox('uploadBox')">Upload Excel</button>
      <button onclick="showBox('searchBox')">Search CNIC</button>
      <button onclick="exportExcel()">Export Excel</button>
      <button onclick="logout()">Logout</button>
    </div>

    <!-- Upload -->
    <div id="uploadBox" class="box hidden">
      <h3>Upload Excel File</h3>
      <input type="file" id="excel">
      <button onclick="uploadExcel()">Upload</button>
      <p id="uploadMsg"></p>
    </div>

    <!-- Search -->
    <div id="searchBox" class="box hidden">
      <h3>Search by CNIC</h3>
      <input id="cnic" placeholder="Enter CNIC">
      <button onclick="searchCNIC()">Search</button>
      <div id="result"></div>
    </div>

  </div>
</div>

<script>
/* ================= CONFIG ================= */
const API_BASE = "https://pm-ybls.vercel.app";
/* ========================================= */

/* ---------- Auto Login ---------- */
if(localStorage.getItem("token")){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  loadStats();
}

/* ---------- UI ---------- */
function showBox(id){
  ["uploadBox","searchBox"].forEach(b=>{
    document.getElementById(b).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

/* ---------- Login ---------- */
async function login(){
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;
  const err=document.getElementById("loginError");

  err.classList.add("hidden");

  const res=await fetch(API_BASE+"/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email,password})
  });

  const data=await res.json();

  if(!res.ok){
    err.textContent=data.message||"Login failed";
    err.classList.remove("hidden");
    return;
  }

  localStorage.setItem("token",data.token);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  loadStats();
}

/* ---------- Logout ---------- */
function logout(){
  localStorage.clear();
  location.reload();
}

/* ---------- Stats ---------- */
async function loadStats(){
  const res=await fetch(API_BASE+"/api/stats");
  const data=await res.json();
  document.getElementById("total").innerText=data.total||0;
}

/* ---------- Upload ---------- */
async function uploadExcel(){
  const file=document.getElementById("excel").files[0];
  if(!file) return alert("Please select Excel file");

  const res=await fetch(API_BASE+"/api/upload",{method:"POST",body:file});
  const data=await res.json();

  document.getElementById("uploadMsg").innerText=data.message||"Uploaded";
  loadStats();
}

/* ---------- Search ---------- */
async function searchCNIC(){
  const cnic=document.getElementById("cnic").value;
  const res=await fetch(API_BASE+"/api/search?cnic="+cnic);
  const data=await res.json();

  if(!res.ok){
    document.getElementById("result").innerHTML="No record found";
    return;
  }

  document.getElementById("result").innerHTML=`
    <p><b>Name:</b> ${data.applicant_name}</p>
    <p><b>CNIC:</b> ${data.applicant_cnic}</p>
    <p><b>Business:</b> ${data.business_sub_sector}</p>
    <p><b>Bank:</b> ${data.mfibankname}</p>
  `;
}

/* ---------- Export ---------- */
function exportExcel(){
  window.open(API_BASE+"/api/export","_blank");
}
</script>

</body>
</html>
