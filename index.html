<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PMYBLS | Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #020617, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
    }

    .card {
      background: #020617;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      border: 1px solid #1e293b;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 26px;
    }

    p {
      text-align: center;
      margin-bottom: 25px;
      color: #94a3b8;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5f5;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      font-size: 15px;
      margin-bottom: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    .error {
      margin-top: 14px;
      text-align: center;
      color: #f87171;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>PMYBLS</h1>
    <p>Admin Control Panel Login</p>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="admin@pmybls.com" required />

      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required />

      <button type="submit">Login</button>
    </form>

    <div id="error" class="error"></div>

    <div class="footer">
      © PMYBLS | Secure System
    </div>
  </div>

  <!-- LOGIN SCRIPT -->
  <script>
    const API_BASE = "https://pmybls.vercel.app";

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("error");

      errorBox.innerText = "";

      try {
        const res = await fetch(API_BASE + "/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorBox.innerText = data.message || "Login failed";
          return;
        }

        localStorage.setItem("token", data.token);

        alert("Login successful");
        // future dashboard redirect
        // window.location.href = "dashboard.html";

      } catch (err) {
        console.error(err);
        errorBox.innerText = "Server or network error";
      }
    });
  </script>

  <!-- VERCEL SPEED INSIGHTS -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

</body>
</html>
