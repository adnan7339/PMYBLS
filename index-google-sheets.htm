<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMYBLS - Advanced Applicant Search System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    :root {
        --primary: #00f5ff;
        --secondary: #ff0080;
        --accent: #7c3aed;
        --success: #00ff88;
        --error: #ff4757;
        --warning: #ffa502;
        --dark: #0a0e27;
        --dark-900: #050814;
        --dark-800: #0f1729;
        --dark-700: #1a2238;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
    }
    
    body {
        font-family: 'Outfit', -apple-system, sans-serif;
        background: var(--dark-900);
        color: #fff;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }
    
    /* Animated Background */
    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
    }
    
    .bg-gradient {
        position: absolute;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 20% 50%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(255, 0, 128, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 40% 20%, rgba(124, 58, 237, 0.1) 0%, transparent 50%);
        animation: bgMove 20s ease-in-out infinite;
    }
    
    @keyframes bgMove {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(-50px, -50px) rotate(5deg); }
    }
    
    .grid-overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
            linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: gridScroll 30s linear infinite;
    }
    
    @keyframes gridScroll {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
    }
    
    /* Floating Orbs */
    .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.4;
        animation: float 15s ease-in-out infinite;
        pointer-events: none;
    }
    
    .orb-1 {
        width: 300px;
        height: 300px;
        background: var(--primary);
        top: 10%;
        left: 20%;
        animation-delay: 0s;
    }
    
    .orb-2 {
        width: 400px;
        height: 400px;
        background: var(--secondary);
        bottom: 15%;
        right: 15%;
        animation-delay: 3s;
    }
    
    .orb-3 {
        width: 250px;
        height: 250px;
        background: var(--accent);
        top: 50%;
        right: 30%;
        animation-delay: 6s;
    }
    
    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -40px) scale(1.1); }
        66% { transform: translate(-20px, 30px) scale(0.9); }
    }
    
    /* Particles */
    .particles {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
    }
    
    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: rgba(0, 245, 255, 0.6);
        border-radius: 50%;
        animation: particleFloat 20s linear infinite;
        box-shadow: 0 0 10px rgba(0, 245, 255, 0.8);
    }
    
    @keyframes particleFloat {
        0% {
            transform: translateY(100vh) translateX(0);
            opacity: 0;
        }
        10% {
            opacity: 1;
        }
        90% {
            opacity: 1;
        }
        100% {
            transform: translateY(-100vh) translateX(100px);
            opacity: 0;
        }
    }
    
    /* Main Container */
    .container {
        position: relative;
        z-index: 1;
        max-width: 1600px;
        margin: 0 auto;
        padding: 40px 20px;
        animation: fadeInUp 0.8s ease-out;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Header */
    .header {
        text-align: center;
        margin-bottom: 60px;
        position: relative;
    }
    
    .logo-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
        animation: logoReveal 1s ease-out;
    }
    
    @keyframes logoReveal {
        from {
            opacity: 0;
            transform: scale(0.8);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
    
    .logo {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        box-shadow: 0 20px 60px rgba(0, 245, 255, 0.3),
                    0 0 0 1px rgba(255, 255, 255, 0.1);
        position: relative;
        animation: logoFloat 3s ease-in-out infinite;
    }
    
    @keyframes logoFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
    }
    
    .logo::before {
        content: '';
        position: absolute;
        inset: -5px;
        background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
        border-radius: 35px;
        z-index: -1;
        opacity: 0.3;
        filter: blur(20px);
        animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
    }
    
    h1 {
        font-size: 56px;
        font-weight: 900;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 15px;
        letter-spacing: -2px;
        text-transform: uppercase;
        animation: titleShine 3s ease-in-out infinite;
    }
    
    @keyframes titleShine {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.2); }
    }
    
    .subtitle {
        font-size: 20px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 300;
        letter-spacing: 2px;
        margin-bottom: 25px;
    }
    
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 28px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 50px;
        font-size: 14px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        animation: badgePulse 2s ease-in-out infinite;
    }
    
    @keyframes badgePulse {
        0%, 100% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        50% { box-shadow: 0 8px 32px rgba(0, 245, 255, 0.4); }
    }
    
    .status-dot {
        width: 10px;
        height: 10px;
        background: var(--success);
        border-radius: 50%;
        box-shadow: 0 0 20px var(--success);
        animation: dotBlink 1.5s ease-in-out infinite;
    }
    
    @keyframes dotBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }
    
    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
        margin-bottom: 50px;
        animation: statsReveal 1s ease-out 0.3s both;
    }
    
    @keyframes statsReveal {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .stat-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 35px;
        backdrop-filter: blur(20px);
        position: relative;
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        transform-style: preserve-3d;
        perspective: 1000px;
    }
    
    .stat-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.15), transparent);
        transition: left 0.8s;
    }
    
    .stat-card::after {
        content: '';
        position: absolute;
        inset: -2px;
        background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent), var(--primary));
        background-size: 300% 300%;
        border-radius: 24px;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.5s;
        animation: gradientShift 4s ease infinite;
    }
    
    @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }
    
    .stat-card:hover::before {
        left: 100%;
    }
    
    .stat-card:hover::after {
        opacity: 0.6;
    }
    
    .stat-card:hover {
        transform: translateY(-12px) scale(1.03) rotateX(5deg);
        border-color: var(--primary);
        box-shadow: 0 25px 70px rgba(0, 245, 255, 0.3),
                    0 0 50px rgba(0, 245, 255, 0.2);
    }
    
    .stat-icon {
        font-size: 48px;
        margin-bottom: 20px;
        display: inline-block;
        filter: drop-shadow(0 0 25px currentColor);
        animation: iconPulse 3s ease-in-out infinite;
        transition: transform 0.4s ease;
    }
    
    @keyframes iconPulse {
        0%, 100% { 
            filter: drop-shadow(0 0 25px currentColor);
            transform: scale(1);
        }
        50% { 
            filter: drop-shadow(0 0 35px currentColor);
            transform: scale(1.05);
        }
    }
    
    .stat-card:hover .stat-icon {
        transform: scale(1.15) rotateZ(5deg);
        filter: drop-shadow(0 0 40px currentColor);
    }
    
    .stat-label {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 15px;
        transition: color 0.3s;
    }
    
    .stat-card:hover .stat-label {
        color: var(--primary);
    }
    
    .stat-value {
        font-size: 48px;
        font-weight: 900;
        font-family: 'JetBrains Mono', monospace;
        background: linear-gradient(135deg, #fff, rgba(255, 255, 255, 0.7));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        transition: all 0.4s ease;
    }
    
    .stat-card:hover .stat-value {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        transform: scale(1.1);
    }
    
    /* Search Section */
    .search-section {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        padding: 45px;
        backdrop-filter: blur(20px);
        margin-bottom: 50px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: searchReveal 1s ease-out 0.5s both;
        position: relative;
        overflow: hidden;
    }
    
    .search-section::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(0, 245, 255, 0.1) 0%, transparent 70%);
        animation: searchGlow 8s ease-in-out infinite;
        pointer-events: none;
    }
    
    @keyframes searchGlow {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        50% { transform: translate(20px, 20px) scale(1.1); opacity: 0.5; }
    }
    
    @keyframes searchReveal {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .search-label {
        font-size: 16px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 20px;
        display: block;
        letter-spacing: 1px;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
    }
    
    .search-wrapper {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        align-items: stretch;
        position: relative;
        z-index: 1;
    }
    
    #cnic {
        flex: 1;
        min-width: 300px;
        padding: 20px 28px;
        font-size: 22px;
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
        background: var(--dark-800);
        border: 2px solid var(--glass-border);
        border-radius: 16px;
        color: #fff;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        letter-spacing: 2px;
        position: relative;
    }
    
    #cnic::before {
        content: '';
        position: absolute;
        inset: -2px;
        background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
        background-size: 300% 300%;
        border-radius: 16px;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.4s;
        animation: gradientShift 3s ease infinite;
    }
    
    #cnic:focus::before {
        opacity: 1;
    }
    
    #cnic:focus {
        outline: none;
        border-color: transparent;
        box-shadow: 0 0 0 4px rgba(0, 245, 255, 0.15),
                    0 0 50px rgba(0, 245, 255, 0.3),
                    0 10px 30px rgba(0, 0, 0, 0.3);
        transform: translateY(-3px) scale(1.01);
    }
    
    #cnic::placeholder {
        color: rgba(255, 255, 255, 0.3);
        font-weight: 400;
    }
    
    .btn {
        padding: 20px 35px;
        font-size: 16px;
        font-weight: 700;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-transform: uppercase;
        letter-spacing: 1px;
        position: relative;
        overflow: hidden;
        font-family: 'Outfit', sans-serif;
    }
    
    .btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        transform: translate(-50%, -50%);
        transition: width 0.5s, height 0.5s;
    }
    
    .btn:hover::before {
        width: 300px;
        height: 300px;
    }
    
    .btn::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 16px;
        padding: 2px;
        background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.3s;
    }
    
    .btn:hover::after {
        opacity: 0.6;
    }
    
    .btn span {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: var(--dark);
        box-shadow: 0 10px 40px rgba(0, 245, 255, 0.3);
    }
    
    .btn-primary:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 50px rgba(0, 245, 255, 0.5);
    }
    
    .btn-primary:active {
        transform: translateY(-1px) scale(1);
    }
    
    .btn-secondary {
        background: var(--dark-700);
        color: #fff;
        border: 1px solid var(--glass-border);
    }
    
    .btn-secondary:hover {
        background: var(--dark-600);
        border-color: var(--primary);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 30px rgba(0, 245, 255, 0.2);
    }
    
    .btn-success {
        background: linear-gradient(135deg, var(--success), #00cc70);
        color: var(--dark);
        box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
    }
    
    .btn-success:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 50px rgba(0, 255, 136, 0.5);
    }
    
    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
    }
    
    /* Loading Overlay */
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 14, 39, 0.98);
        backdrop-filter: blur(15px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
    }
    
    .loading-overlay::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(0, 245, 255, 0.1) 0%, transparent 70%);
        animation: loadingPulse 2s ease-in-out infinite;
    }
    
    @keyframes loadingPulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
    }
    
    .loading-overlay.active {
        opacity: 1;
        pointer-events: all;
    }
    
    .loading-content {
        text-align: center;
        position: relative;
        z-index: 1;
    }
    
    .spinner {
        width: 100px;
        height: 100px;
        margin: 0 auto 40px;
        border: 5px solid rgba(0, 245, 255, 0.1);
        border-top: 5px solid var(--primary);
        border-right: 5px solid var(--secondary);
        border-radius: 50%;
        animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        position: relative;
        box-shadow: 0 0 50px rgba(0, 245, 255, 0.3);
    }
    
    .spinner::before {
        content: '';
        position: absolute;
        inset: 10px;
        border: 3px solid transparent;
        border-top: 3px solid var(--accent);
        border-radius: 50%;
        animation: spin 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse;
    }
    
    .spinner::after {
        content: '';
        position: absolute;
        inset: 20px;
        border: 2px solid transparent;
        border-top: 2px solid var(--secondary);
        border-radius: 50%;
        animation: spin 2.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .loading-text {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textPulse 2s ease-in-out infinite;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    @keyframes textPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
    }
    
    /* Status Message */
    .status-message {
        padding: 20px 30px;
        border-radius: 16px;
        margin-bottom: 30px;
        font-weight: 600;
        display: none;
        align-items: center;
        gap: 15px;
        backdrop-filter: blur(10px);
        animation: slideDown 0.4s ease-out;
    }
    
    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .status-message.success {
        background: rgba(0, 255, 136, 0.15);
        border: 1px solid rgba(0, 255, 136, 0.3);
        color: var(--success);
        display: flex;
    }
    
    .status-message.error {
        background: rgba(255, 71, 87, 0.15);
        border: 1px solid rgba(255, 71, 87, 0.3);
        color: var(--error);
        display: flex;
    }
    
    .status-message.info {
        background: rgba(0, 245, 255, 0.15);
        border: 1px solid rgba(0, 245, 255, 0.3);
        color: var(--primary);
        display: flex;
    }
    
    /* Results Section */
    .results-section {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        padding: 45px;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: resultsReveal 1s ease-out 0.7s both;
        position: relative;
        overflow: hidden;
    }
    
    .results-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent), var(--primary));
        background-size: 200% 100%;
        animation: borderFlow 3s linear infinite;
    }
    
    @keyframes borderFlow {
        0% { background-position: 0% 0%; }
        100% { background-position: 200% 0%; }
    }
    
    @keyframes resultsReveal {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
        flex-wrap: wrap;
        gap: 20px;
    }
    
    .results-title {
        font-size: 28px;
        font-weight: 900;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        background: linear-gradient(135deg, #fff, var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
        animation: titleGlow 3s ease-in-out infinite;
    }
    
    @keyframes titleGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.3)); }

<body>

<!-- Background Animation -->
<div class="bg-animation">
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading">
    <div class="loading-content">
        <div class="spinner"></div>
        <div class="loading-text">Processing Request...</div>
    </div>
</div>

<!-- Main Container -->
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo-container">
            <div class="logo">🔍</div>
        </div>
        <h1>PMYBLS Search System</h1>
        <p class="subtitle">Prime Minister Youth Business & Agriculture Loan Scheme</p>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="connectionText">Connected to Google Sheets</span>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">📊</div>
            <div class="stat-label">Total Records</div>
            <div class="stat-value" id="totalRecords">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🔍</div>
            <div class="stat-label">Searches Today</div>
            <div class="stat-value" id="searchCount">0</div>
        </div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
        <label class="search-label">🔎 Enter Applicant CNIC</label>
        <div class="search-wrapper">
            <input 
                type="text" 
                id="cnic" 
                placeholder="XXXXX-XXXXXXX-X"
                maxlength="15"
                autocomplete="off"
            >
            <button class="btn btn-primary" onclick="searchData()">
                <span>🚀 Search</span>
            </button>
            <button class="btn btn-secondary" onclick="clearResults()">
                <span>🔄 Clear</span>
            </button>
            <button class="btn btn-secondary" onclick="refreshData()">
                <span>♻️ Refresh Data</span>
            </button>
        </div>
    </div>

    <!-- Status Message -->
    <div class="status-message" id="statusMessage"></div>

    <!-- Results Section -->
    <div class="results-section">
        <div class="results-header">
            <h2 class="results-title">📋 Search Results</h2>
            <button class="btn btn-success" id="exportBtn" onclick="exportToExcel()">
                <span>📥 Export to Excel</span>
            </button>
        </div>
        <div class="table-wrapper">
            <table id="resultTable">
                <tbody>
                    <tr>
                        <td class="no-data" colspan="4">
                            <div class="no-data-icon">🎯</div>
                            <div style="font-size: 24px; font-weight: 700; margin-bottom: 15px;">
                                Ready to Search
                            </div>
                            <div style="font-size: 16px; color: rgba(255, 255, 255, 0.5);">
                                Enter Applicant CNIC to view details
                            </div>
                            <div style="font-size: 14px; color: rgba(255, 255, 255, 0.3); margin-top: 15px;">
                                Format: XXXXX-XXXXXXX-X (13 digits)
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// Google Sheets Configuration
const SHEET_ID = '1n2_6Oewp88igcRv5H7vKYpYH-jHmnTus';
const SHEET_NAME = 'Sheet1'; // Update if your sheet name is different

// Columns to display
const COLUMNS_TO_DISPLAY = {
    'Applicant CNIC': 'Applicant CNIC',
    'Applicant Name': 'Applicant Name',
    'Business Sub Sector': 'Business Sub Sector',
    'MFIBankName': 'MFIBankName'
};

// Global variables
let excelData = [];
let headers = [];
let searchResults = [];
let searchCount = 0;

// Initialize
window.addEventListener('DOMContentLoaded', function() {
    loadDataFromGoogleSheets();
    updateSearchCount();
    createParticles();
});

// Create floating particles
function createParticles() {
    const particlesContainer = document.getElementById('particles');
    const particleCount = 30;
    
    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';
        particlesContainer.appendChild(particle);
    }
}

// Load data from Google Sheets
async function loadDataFromGoogleSheets() {
    try {
        showStatus('🔄 Loading data from Google Sheets...', 'info');
        document.getElementById('connectionText').textContent = 'Connecting...';
        
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
        const response = await fetch(csvUrl);
        
        if (!response.ok) {
            throw new Error('Failed to fetch data');
        }
        
        const csvText = await response.text();
        excelData = parseCSV(csvText);
        
        if (excelData.length > 0) {
            headers = excelData[0];
            document.getElementById('totalRecords').textContent = (excelData.length - 1).toLocaleString();
            document.getElementById('connectionText').textContent = 'Connected to Google Sheets';
            showStatus('✅ Data loaded successfully! Ready to search.', 'success');
            
            setTimeout(() => {
                document.getElementById('statusMessage').style.display = 'none';
            }, 3000);
        } else {
            throw new Error('No data found');
        }
    } catch (error) {
        console.error('Error loading data:', error);
        showStatus('❌ Failed to load data. Please check connection and try again.', 'error');
        document.getElementById('connectionText').textContent = 'Connection Error';
    }
}

// Parse CSV
function parseCSV(csv) {
    const lines = csv.split('\n');
    const result = [];
    
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        
        const row = [];
        let field = '';
        let inQuotes = false;
        
        for (let j = 0; j < line.length; j++) {
            const char = line[j];
            const nextChar = line[j + 1];
            
            if (char === '"') {
                if (inQuotes && nextChar === '"') {
                    field += '"';
                    j++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                row.push(field.trim());
                field = '';
            } else {
                field += char;
            }
        }
        row.push(field.trim());
        result.push(row);
    }
    
    return result;
}

// Refresh data
async function refreshData() {
    showStatus('🔄 Refreshing PMYBLS data...', 'info');
    await loadDataFromGoogleSheets();
}

// Normalize CNIC
function normalize(val) {
    if (val === null || val === undefined) return "";
    return String(val).replace(/\D/g, "");
}

// Find column index by name
function getColumnIndex(columnName) {
    return headers.findIndex(h => 
        h && h.toLowerCase().trim() === columnName.toLowerCase().trim()
    );
}

// Search function
function searchData() {
    const inputCNIC = normalize(document.getElementById("cnic").value.trim());
    
    if (!inputCNIC) {
        showStatus('⚠️ Please enter an Applicant CNIC', 'error');
        return;
    }
    
    if (inputCNIC.length < 13) {
        showStatus('⚠️ CNIC must be 13 digits', 'error');
        return;
    }
    
    document.getElementById('loading').classList.add('active');
    
    setTimeout(() => {
        performSearch(inputCNIC);
        document.getElementById('loading').classList.remove('active');
        searchCount++;
        updateSearchCount();
    }, 500);
}

function performSearch(inputCNIC) {
    const table = document.getElementById("resultTable");
    const dataRows = excelData.slice(1);
    
    // Debug: Show all column headers
    console.log('=== DEBUGGING COLUMN HEADERS ===');
    console.log('Total headers:', headers.length);
    headers.forEach((header, idx) => {
        console.log(`Column ${idx}: "${header}"`);
    });
    
    const cnicColIndex = getColumnIndex('Applicant CNIC');
    
    if (cnicColIndex === -1) {
        showStatus('❌ "Applicant CNIC" column not found in sheet', 'error');
        return;
    }
    
    let results = [];
    const batchSize = 1000;
    for (let i = 0; i < dataRows.length; i += batchSize) {
        const batch = dataRows.slice(i, i + batchSize);
        const batchResults = batch.filter(row => normalize(row[cnicColIndex]) === inputCNIC);
        results = results.concat(batchResults);
        if (results.length > 0) break;
    }
    
    searchResults = results;
    
    if (results.length === 0) {
        const formattedCNIC = inputCNIC.length === 13 
            ? inputCNIC.substr(0, 5) + '-' + inputCNIC.substr(5, 7) + '-' + inputCNIC.substr(12, 1)
            : inputCNIC;
        table.innerHTML = `
            <tbody>
                <tr>
                    <td class="no-data" colspan="4">
                        <div class="no-data-icon">❌</div>
                        <div style="font-size: 24px; font-weight: 700; margin-bottom: 15px;">
                            No Applicant Found
                        </div>
                        <div style="font-size: 18px; color: var(--error); font-family: 'JetBrains Mono', monospace; margin-bottom: 15px;">
                            CNIC: ${formattedCNIC}
                        </div>
                        <div style="font-size: 16px; color: rgba(255, 255, 255, 0.5);">
                            This CNIC is not in the PMYBLS database
                        </div>
                    </td>
                </tr>
            </tbody>
        `;
        showStatus('❌ No applicant found with this CNIC', 'error');
        document.getElementById('exportBtn').style.display = 'none';
        return;
    }
    
    // Get column indices
    const columnIndices = {};
    console.log('=== SEARCHING FOR COLUMNS ===');
    for (const [key, displayName] of Object.entries(COLUMNS_TO_DISPLAY)) {
        const index = getColumnIndex(key);
        console.log(`Column "${key}" -> Index: ${index}`);
        if (index !== -1) {
            columnIndices[displayName] = index;
        }
    }
    
    console.log('=== FINAL COLUMN INDICES ===');
    console.log(columnIndices);
    
    console.log('=== SAMPLE ROW DATA ===');
    if (results.length > 0) {
        console.log('First result row:', results[0]);
    }
    
    // Build table header
    let tableHTML = '<thead><tr>';
    for (const displayName of Object.values(COLUMNS_TO_DISPLAY)) {
        if (columnIndices[displayName] !== undefined) {
            tableHTML += `<th>${displayName}</th>`;
        }
    }
    tableHTML += '</tr></thead><tbody>';
    
    // Build table rows
    results.forEach((row, index) => {
        tableHTML += `<tr style="animation: fadeInUp 0.5s ease-out ${index * 0.1}s both;">`;
        for (const displayName of Object.values(COLUMNS_TO_DISPLAY)) {
            const colIndex = columnIndices[displayName];
            if (colIndex !== undefined) {
                const cellValue = row[colIndex] !== undefined && row[colIndex] !== null && row[colIndex] !== '' 
                    ? row[colIndex] 
                    : '-';
                tableHTML += `<td>${cellValue}</td>`;
            }
        }
        tableHTML += '</tr>';
    });
    
    tableHTML += '</tbody>';
    table.innerHTML = tableHTML;
    
    showStatus(`✅ Found ${results.length} applicant record(s)`, 'success');
    document.getElementById('exportBtn').style.display = 'inline-flex';
}

// Clear results
function clearResults() {
    document.getElementById('cnic').value = '';
    document.getElementById('resultTable').innerHTML = `
        <tbody>
            <tr>
                <td class="no-data" colspan="4">
                    <div class="no-data-icon">🎯</div>
                    <div style="font-size: 24px; font-weight: 700; margin-bottom: 15px;">
                        Ready to Search
                    </div>
                    <div style="font-size: 16px; color: rgba(255, 255, 255, 0.5);">
                        Enter Applicant CNIC to view details
                    </div>
                    <div style="font-size: 14px; color: rgba(255, 255, 255, 0.3); margin-top: 15px;">
                        Format: XXXXX-XXXXXXX-X (13 digits)
                    </div>
                </td>
            </tr>
        </tbody>
    `;
    document.getElementById('statusMessage').style.display = 'none';
    searchResults = [];
    document.getElementById('exportBtn').style.display = 'none';
}

// Export to Excel
function exportToExcel() {
    if (searchResults.length === 0) {
        showStatus('⚠️ No results to export', 'error');
        return;
    }
    
    const columnIndices = {};
    for (const [key, displayName] of Object.entries(COLUMNS_TO_DISPLAY)) {
        const index = getColumnIndex(key);
        if (index !== -1) {
            columnIndices[displayName] = index;
        }
    }
    
    let csv = Object.values(COLUMNS_TO_DISPLAY).filter(name => columnIndices[name] !== undefined).join(',') + '\n';
    
    searchResults.forEach(row => {
        const rowData = [];
        for (const displayName of Object.values(COLUMNS_TO_DISPLAY)) {
            const colIndex = columnIndices[displayName];
            if (colIndex !== undefined) {
                const cell = row[colIndex] || '';
                rowData.push(`"${cell}"`);
            }
        }
        csv += rowData.join(',') + '\n';
    });
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pmybls_applicant_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    window.URL.revokeObjectURL(url);
    
    showStatus('✅ Applicant data exported successfully!', 'success');
}

// Show status
function showStatus(message, type) {
    const statusDiv = document.getElementById('statusMessage');
    statusDiv.textContent = message;
    statusDiv.className = 'status-message ' + type;
    
    if (!message) {
        statusDiv.style.display = 'none';
    }
}

// Update search count
function updateSearchCount() {
    document.getElementById('searchCount').textContent = searchCount;
}

// Enter key search
document.getElementById('cnic').addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !this.disabled) {
        searchData();
    }
});

// Format CNIC input
document.getElementById('cnic').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    
    if (value.length > 13) {
        value = value.substr(0, 13);
    }
    
    let formatted = '';
    if (value.length > 0) {
        formatted = value.substr(0, 5);
        if (value.length > 5) {
            formatted += '-' + value.substr(5, 7);
        }
        if (value.length > 12) {
            formatted += '-' + value.substr(12, 1);
        }
    }
    
    e.target.value = formatted;
});
</script>
